name: Bug
description: Something in the SDK, protocol, harness or research scripts does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command, the output and what you expected.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 22.11, commit abc1234"
    validations:
      required: true
